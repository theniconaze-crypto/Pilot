<style>
:root{
  --bg-deep:#12161d;
  --bg-panel:#1a2029;
  --bg-panel-2:#212936;
  --bg-raised:#262f3d;
  --border:#2c3543;
  --border-soft:#232b38;
  --text-1:#e9edf3;
  --text-2:#aab3c2;
  --text-3:#6d7889;
  --accent:#4d9fff;
  --accent-soft:rgba(77,159,255,.14);
  --cyan:#37c9c1;
  --amber:#f5a524;
  --amber-soft:rgba(245,165,36,.14);
  --red:#f0555c;
  --red-soft:rgba(240,85,92,.14);
  --green:#3ecf8e;
  --green-soft:rgba(62,207,142,.14);
  --violet:#9d7bff;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg-deep);
  color:var(--text-1);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(77,159,255,.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(157,123,255,.05), transparent 40%);
}
button,.nav-btn,.proj-item,.btn,.io-btn,a{touch-action:manipulation;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2f3846;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#3a4454;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;color:var(--text-1);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- LAYOUT ---------- */
#app{display:grid;grid-template-columns:250px 1fr;height:100vh;height:100dvh;}
.menu-toggle{display:none;}
#sidebarBackdrop{display:none;}

/* ---------- SIDEBAR ---------- */
#sidebar{
  background:linear-gradient(180deg,#151b23,#10141a);
  border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;
  padding:20px 14px;
  padding-top:calc(20px + env(safe-area-inset-top));
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 22px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:17px;color:#0b1016;
  flex:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 4px 14px rgba(77,159,255,.35);
}
.brand-text .t1{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.06em;line-height:1;}
.brand-text .t2{font-size:10.5px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}

.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);padding:14px 10px 8px;font-weight:600;}
.nav-btn{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:9px 12px;border:none;background:transparent;color:var(--text-2);
  border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;text-align:left;
  transition:background .15s,color .15s;
}
.nav-btn svg{flex:none;opacity:.85;}
.nav-btn:hover{background:var(--bg-panel-2);color:var(--text-1);}
.nav-btn.active{background:var(--accent-soft);color:var(--accent);}
.nav-btn.active svg{opacity:1;}
.nav-btn .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;background:var(--bg-raised);color:var(--text-2);padding:1px 6px;border-radius:20px;}
.nav-btn.active .count{background:rgba(77,159,255,.22);color:var(--accent);}

.proj-list{display:flex;flex-direction:column;gap:2px;margin-top:2px;}
.proj-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);
  color:var(--text-2);font-size:13px;border:1px solid transparent;
}
.proj-item:hover{background:var(--bg-panel-2);}
.proj-item.active{background:var(--bg-panel-2);border-color:var(--border);color:var(--text-1);}
.proj-dot{width:9px;height:9px;border-radius:3px;flex:none;}
.proj-item .pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.proj-item .del-proj{opacity:0;flex:none;background:none;border:none;color:var(--text-3);padding:2px;border-radius:4px;}
.proj-item:hover .del-proj{opacity:1;}
.proj-item .del-proj:hover{color:var(--red);background:var(--red-soft);}
/* Sur écran tactile (iPhone/iPad), il n'y a pas de :hover : le bouton supprimer
   doit rester visible en permanence, sinon il est invisible et impossible à trouver. */
@media (hover:none){
  .proj-item .del-proj{opacity:.55;}
}

.btn-ghost-add{
  display:flex;align-items:center;gap:7px;width:100%;padding:8px 10px;margin-top:6px;
  background:transparent;border:1px dashed var(--border);color:var(--text-3);border-radius:var(--radius-sm);font-size:12.5px;
}
.btn-ghost-add:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}

.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:6px;}
.save-state{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3);padding:2px 10px;}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none;}
.save-dot.pending{background:var(--amber);animation:pulse 1s infinite;}
.save-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.io-row{display:flex;gap:6px;}
.io-btn{flex:1;padding:7px 6px;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-2);font-size:11.5px;display:flex;align-items:center;justify-content:center;gap:5px;}
.io-btn:hover{color:var(--text-1);border-color:var(--text-3);}

/* ---------- MAIN ---------- */
#main{overflow-y:auto;height:100vh;height:100dvh;-webkit-overflow-scrolling:touch;}
#topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(18,22,29,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
  padding:16px 28px;display:flex;align-items:center;gap:16px;
}
#topbar h1{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:.01em;}
#topbar .sub{color:var(--text-3);font-size:12.5px;margin-top:2px;}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--bg-panel-2);color:var(--text-1);
  transition:all .15s;
}
.btn:hover{border-color:var(--text-3);background:var(--bg-raised);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#0b1016;}
.btn-primary:hover{background:#69b1ff;border-color:#69b1ff;}
.btn-outline{background:transparent;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-icon{padding:8px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.content-pad{padding:22px 28px 60px;}
.hidden{display:none !important;}

/* ---------- ALERTS BANNER ---------- */
.alerts-bar{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;-webkit-overflow-scrolling:touch;}
.alert-chip{
  flex:none;display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:var(--radius-sm);
  font-size:12.5px;font-weight:500;border:1px solid;white-space:nowrap;
}
.alert-chip.late{background:var(--red-soft);border-color:rgba(240,85,92,.35);color:#ff9095;}
.alert-chip.risk{background:var(--amber-soft);border-color:rgba(245,165,36,.35);color:#ffc266;}
.alert-chip.milestone{background:rgba(77,159,255,.12);border-color:rgba(77,159,255,.35);color:#8fc4ff;}
.alert-chip.budget{background:rgba(157,123,255,.12);border-color:rgba(157,123,255,.35);color:#c3b0ff;}
.alert-chip.ok{background:var(--green-soft);border-color:rgba(62,207,142,.35);color:#7fe8b8;}

/* ---------- PANEL / CARD ---------- */
.panel{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:var(--radius);}
.panel-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border-soft);}
.panel-head h2{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:.01em;}
.panel-head .desc{color:var(--text-3);font-size:12px;margin-top:2px;}
.panel-head .spacer{flex:1;}

/* ---------- GANTT ---------- */
.gantt-toolbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
.seg{display:flex;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
.seg button{padding:6px 12px;background:none;border:none;color:var(--text-2);font-size:12px;font-weight:600;border-right:1px solid var(--border);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--accent);color:#0b1016;}
.legend{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);}
.legend-dot{width:9px;height:9px;border-radius:3px;}
.gantt-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
#ganttSvgWrap{padding:0;}
.gantt-empty{padding:60px 20px;text-align:center;color:var(--text-3);}
.gantt-empty svg{opacity:.35;margin-bottom:10px;}

/* ---------- PHASES LIST ---------- */
.toolbar-row{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap;border-bottom:1px solid var(--border-soft);}
.search-input{
  background:var(--bg-panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 12px;font-size:13px;color:var(--text-1);min-width:200px;flex:1;max-width:320px;
}
.select-input{background:var(--bg-panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:12.5px;color:var(--text-2);}

table.data-table{width:100%;border-collapse:collapse;}
table.data-table th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);
  padding:10px 14px;border-bottom:1px solid var(--border-soft);font-weight:600;position:sticky;top:0;background:var(--bg-panel);
}
table.data-table td{padding:11px 14px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle;}
table.data-table tr:hover td{background:var(--bg-panel-2);}
table.data-table tr:last-child td{border-bottom:none;}
.row-clickable{cursor:pointer;}

.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.status-pill.ontrack{background:var(--green-soft);color:#7fe8b8;}
.status-pill.atrisk{background:var(--amber-soft);color:#ffc266;}
.status-pill.late{background:var(--red-soft);color:#ff9095;}
.status-pill.done{background:rgba(77,159,255,.15);color:#8fc4ff;}
.status-pill.upcoming{background:var(--bg-raised);color:var(--text-2);}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.prog-bar-mini{width:80px;height:6px;background:var(--bg-raised);border-radius:6px;overflow:hidden;}
.prog-bar-mini > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));}

.crit-tag{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.03em;
  padding:2px 7px;border-radius:4px;color:#1a1206;
  background:repeating-linear-gradient(135deg,var(--amber),var(--amber) 6px,#1a1206 6px,#1a1206 8px);
  background-size: 12px 12px;
  background-color:var(--amber);
  text-shadow:0 1px 0 rgba(255,255,255,.25);
}
.crit-tag-simple{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--amber);border:1px solid var(--amber);padding:2px 7px;border-radius:4px;}

/* ---------- KPI GRID ---------- */
.kpi-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;gap:10px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:18px;}
.kpi-card{
  position:relative;background:var(--bg-panel-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 16px 16px;transition:border-color .15s;
}
.kpi-card.excluded{opacity:.45;}
.kpi-card .kchk{position:absolute;top:12px;right:12px;width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
.kpi-card .klabel{font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-right:20px;}
.kpi-card .kvalue{font-family:var(--font-mono);font-size:27px;font-weight:600;margin-top:8px;display:flex;align-items:baseline;gap:5px;}
.kpi-card .kvalue small{font-size:13px;color:var(--text-3);font-weight:400;}
.kpi-card .ktrend{margin-top:7px;font-size:11.5px;color:var(--text-3);}
.kpi-card .kbar{margin-top:10px;height:5px;border-radius:5px;background:var(--bg-raised);overflow:hidden;}
.kpi-card .kbar>div{height:100%;}
.k-good{color:var(--green) !important;}
.k-warn{color:var(--amber) !important;}
.k-bad{color:var(--red) !important;}

.charts-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;padding:0 18px 18px;}
@media (max-width:1100px){.charts-grid{grid-template-columns:1fr;}}
.chart-box{background:var(--bg-panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.chart-box h3{font-family:var(--font-display);font-size:15px;font-weight:600;margin-bottom:4px;}
.chart-box .cdesc{font-size:11.5px;color:var(--text-3);margin-bottom:12px;}

/* ---------- MODAL ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(8,10,14,.65);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto;
}
.modal{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;width:100%;max-width:640px;
  box-shadow:var(--shadow);animation:modalIn .16s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.modal.wide{max-width:760px;}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-family:var(--font-display);font-size:19px;font-weight:600;}
.modal-close{margin-left:auto;background:none;border:none;color:var(--text-3);padding:6px;border-radius:6px;}
.modal-close:hover{color:var(--text-1);background:var(--bg-panel-2);}
.modal-body{padding:20px 22px;max-height:65vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--border-soft);}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.field input,.field select,.field textarea{
  background:var(--bg-panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:60px;}
.field .hint{font-size:10.5px;color:var(--text-3);}
.checkbox-row{display:flex;align-items:center;gap:8px;}
.checkbox-row input{width:16px;height:16px;accent-color:var(--accent);}
.chip-select{display:flex;flex-wrap:wrap;gap:6px;}
.chip-opt{padding:5px 10px;border:1px solid var(--border);border-radius:20px;font-size:11.5px;color:var(--text-2);background:var(--bg-panel-2);}
.chip-opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.section-sub{font-family:var(--font-display);font-size:15px;font-weight:600;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--border-soft);display:flex;align-items:center;gap:8px;}
.mini-list{display:flex;flex-direction:column;gap:8px;}
.mini-item{background:var(--bg-panel-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;}
.mini-item .body{flex:1;}
.mini-item .rm{flex:none;background:none;border:none;color:var(--text-3);}
.mini-item .rm:hover{color:var(--red);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}

/* export config modal */
.range-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.kpi-export-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;}
.kpi-export-item{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:6px;}
.kpi-export-item:hover{background:var(--bg-panel-2);}
.kpi-export-item input{width:16px;height:16px;accent-color:var(--accent);}
.kpi-export-item .nm{font-size:13px;flex:1;}
.kpi-export-item .vl{font-family:var(--font-mono);font-size:12px;color:var(--text-3);}

.empty-state{padding:60px 20px;text-align:center;color:var(--text-3);}
.empty-state svg{opacity:.3;margin-bottom:12px;}
.empty-state .t{font-family:var(--font-display);font-size:18px;color:var(--text-2);margin-bottom:4px;}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-raised);border:1px solid var(--border);color:var(--text-1);padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;box-shadow:var(--shadow);z-index:200;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.priority-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;}
.pr-Basse{background:var(--bg-raised);color:var(--text-2);}
.pr-Moyenne{background:rgba(77,159,255,.15);color:#8fc4ff;}
.pr-Haute{background:var(--amber-soft);color:#ffc266;}
.pr-Critique{background:var(--red-soft);color:#ff9095;}

.resp-avatar{width:22px;height:22px;border-radius:50%;background:var(--bg-raised);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:var(--text-2);margin-right:6px;}

/* Print target (off-screen for export) */
#printTarget{position:fixed;left:-99999px;top:0;background:#fff;}

@media (max-width:900px){
  #app{grid-template-columns:1fr;}

  /* Sidebar becomes an off-canvas drawer instead of vanishing */
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:110;
    width:82vw;max-width:300px;
    transform:translateX(-100%);
    transition:transform .22s ease;
    box-shadow:var(--shadow);
  }
  #sidebar.open{transform:translateX(0);}

  #sidebarBackdrop{
    display:block;position:fixed;inset:0;background:rgba(8,10,14,.6);
    z-index:105;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  #sidebarBackdrop.open{opacity:1;pointer-events:auto;}

  /* Empêche le contenu de défiler en arrière-plan pendant que le tiroir est ouvert */
  body.sidebar-lock #main{overflow:hidden;}

  /* Hamburger button in the topbar */
  .menu-toggle{
    display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;flex:none;border-radius:var(--radius-sm);
    background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text-1);
  }

  #topbar{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;gap:10px;}
  #topbar h1{font-size:19px;}
  #topbar .sub{display:none;}
  #topbar{flex-wrap:wrap;}
  .topbar-actions{gap:6px;flex-wrap:wrap;margin-left:0;width:100%;}

  .content-pad{padding:14px 14px calc(60px + env(safe-area-inset-bottom));}

  /* Comfortable touch targets (Apple HIG recommends ~44px) */
  .nav-btn{padding:12px;font-size:14.5px;}
  .btn{padding:11px 14px;min-height:44px;}
  .btn-sm{padding:9px 12px;min-height:40px;}
  .io-btn{padding:11px 6px;}
  .proj-item{padding:11px 10px;}

  /* Prevent iOS Safari's auto-zoom-on-focus (triggers below 16px) */
  .field input,.field select,.field textarea,
  .search-input,.select-input{font-size:16px;}

  .form-grid{grid-template-columns:1fr;}
  .modal-backdrop{padding:0;align-items:stretch;}
  .modal{
    max-width:none;width:100%;min-height:100%;border-radius:0;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  }
  .modal-body{max-height:none;}

  .kpi-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  #toast{bottom:calc(20px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:360px;}

  /* Zones tactiles confortables pour les boutons icône seuls */
  .modal-close{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .btn-icon{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;padding:8px;}
}

@media (max-width:520px){
  #topbar h1{font-size:17px;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-text">
        <div class="t1">PILOT</div>
        <div class="t2">Pilotage industriel</div>
      </div>
    </div>

    <div class="nav-group-label">Vue d'ensemble</div>
    <button class="nav-btn active" data-tab="planning" id="navPlanning">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
      Planification
    </button>
    <button class="nav-btn" data-tab="phases" id="navPhases">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      Suivi des phases
      <span class="count" id="countPhases">0</span>
    </button>
    <button class="nav-btn" data-tab="risks" id="navRisks">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      Risques
      <span class="count" id="countRisks">0</span>
    </button>
    <button class="nav-btn" data-tab="kpi" id="navKpi">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-6 3 3 5-7"/></svg>
      KPI &amp; Rapports
    </button>

    <div class="nav-group-label">Projets</div>
    <div class="proj-list" id="projList"></div>
    <button class="btn-ghost-add" id="addProjectBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      Nouveau projet
    </button>

    <div class="sidebar-foot">
      <div class="save-state"><span class="save-dot" id="saveDot"></span><span id="saveText">Enregistré</span></div>
      <div class="io-row">
        <button class="io-btn" id="exportJsonBtn" title="Exporter les données (JSON)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export
        </button>
        <button class="io-btn" id="importJsonBtn" title="Importer des données (JSON)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          Importer
        </button>
        <input type="file" id="importFileInput" accept="application/json" class="hidden">
      </div>
    </div>
  </aside>

  <div id="sidebarBackdrop"></div>

  <main id="main">
    <div id="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h1 id="pageTitle">Planification</h1>
        <div class="sub" id="pageSub">Diagramme de Gantt et chemin critique</div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>
    <div class="content-pad" id="contentPad"></div>
  </main>

</div>

<div id="toast"></div>
<div id="modalRoot"></div>
<div id="printTarget"></div>

<script>
/* =========================================================================
   PILOT — Outil de gestion de projet industriel
   ========================================================================= */

/* ---------------------------- STATE ---------------------------- */
const PROJECT_COLORS = ['#4d9fff','#37c9c1','#9d7bff','#f5a524','#3ecf8e','#f0555c','#5ec8f8','#e19bff'];
const KPI_DEFS = [
  {id:'progress_global', label:'Avancement global', cat:'Avancement'},
  {id:'phases_ontrack', label:'Phases dans les temps', cat:'Avancement'},
  {id:'phases_atrisk', label:'Phases à risque', cat:'Avancement'},
  {id:'phases_late', label:'Phases en retard', cat:'Avancement'},
  {id:'phases_done', label:'Phases terminées', cat:'Avancement'},
  {id:'milestones_reached', label:'Jalons atteints', cat:'Avancement'},
  {id:'spi', label:'SPI — Indice délais', cat:'Performance'},
  {id:'cpi', label:'CPI — Indice coûts', cat:'Performance'},
  {id:'avg_delay', label:'Retard moyen (phases en retard)', cat:'Performance'},
  {id:'critical_count', label:'Phases sur chemin critique', cat:'Performance'},
  {id:'budget_consumed', label:'Budget consommé', cat:'Budget'},
  {id:'budget_variance', label:'Écart budgétaire', cat:'Budget'},
  {id:'risks_open', label:'Risques ouverts', cat:'Risques'},
  {id:'risks_critical', label:'Risques critiques', cat:'Risques'},
];

let state = null;
let saveTimer = null;
let ganttZoom = 'week'; // day | week | month
let phaseFilters = {search:'', status:'all', project:'all'};

function seedData(){
  const today = new Date();
  const d = (offsetDays)=> fmtDate(addDays(today, offsetDays));
  const p1 = uid(), p2 = uid();
  const ph = (over)=> Object.assign({
    id:uid(), projectId:p1, responsible:'A. Morel', budgetPlanned:10000, budgetActual:0,
    priority:'Moyenne', milestone:false, critical:false, deps:[], progress:0, notes:''
  }, over);
  return {
    projects:[
      {id:p1, name:'Ligne d\'assemblage — Site Nord', color:PROJECT_COLORS[0]},
      {id:p2, name:'Migration ERP Production', color:PROJECT_COLORS[1]},
    ],
    phases:[
      ph({name:'Étude de faisabilité', start:d(-40), end:d(-20), progress:100, responsible:'S. Laurent', budgetPlanned:8000, budgetActual:7600, priority:'Haute'}),
      ph({name:'Conception & plans techniques', start:d(-20), end:d(5), progress:70, responsible:'A. Morel', budgetPlanned:22000, budgetActual:16000, priority:'Haute', deps:[]}),
      ph({name:'Achat & approvisionnement machines', start:d(-5), end:d(20), progress:35, responsible:'K. Benali', budgetPlanned:180000, budgetActual:70000, priority:'Critique'}),
      ph({name:'Jalon — Validation investissement', start:d(6), end:d(6), progress:0, milestone:true, responsible:'Direction', budgetPlanned:0, budgetActual:0, priority:'Critique'}),
      ph({name:'Installation & câblage', start:d(21), end:d(45), progress:0, responsible:'T. Dubois', budgetPlanned:45000, budgetActual:0, priority:'Haute'}),
      ph({name:'Qualification / essais process', start:d(46), end:d(60), progress:0, responsible:'S. Laurent', budgetPlanned:15000, budgetActual:0, priority:'Moyenne'}),
      ph({name:'Mise en production', start:d(61), end:d(70), progress:0, milestone:true, responsible:'Direction', budgetPlanned:0, budgetActual:0, priority:'Critique'}),
      Object.assign(ph({name:'Cadrage & choix éditeur', start:d(-30), end:d(-10), progress:100, responsible:'M. Petit', budgetPlanned:12000, budgetActual:11500, priority:'Haute'}),{projectId:p2}),
      Object.assign(ph({name:'Paramétrage module Production', start:d(-10), end:d(15), progress:55, responsible:'M. Petit', budgetPlanned:38000, budgetActual:24000, priority:'Haute'}),{projectId:p2}),

/* ---------------------------- PERSISTENCE ---------------------------- */
/* Storage adapter: uses the Claude artifact storage API (window.storage) when
   available (i.e. when this file is opened inside Claude's artifact preview),
   and transparently falls back to the browser's localStorage when the file is
   downloaded/hosted and opened directly (window.storage does not exist there,
   e.g. once hosted on GitHub Pages). If the artifact storage API exists but
   errors at runtime (e.g. "Internal server error"), the adapter downgrades
   itself to localStorage (or an in-memory store as a last resort) and retries
   automatically, so a save is never silently lost — only the very first
   failed attempt needs a retry, every attempt after that uses the fallback. */
const STORAGE_KEY = 'pilot-pm-data';
let storageMode = 'unknown';

function makeLocalAdapter(){
  storageMode = 'local';
  return {
    async get(key){
      const v = window.localStorage.getItem(key);
      if(v===null) throw new Error('not found');
      return {key, value:v};
    },
    async set(key,value){ window.localStorage.setItem(key,value); return {key,value}; },
  };
}
function makeMemoryAdapter(){
  storageMode = 'memory';
  const mem = {};
  return {
    async get(key){ if(!(key in mem)) throw new Error('not found'); return {key,value:mem[key]}; },
    async set(key,value){ mem[key]=value; return {key,value}; },
  };
}
function makeLocalOrMemoryAdapter(){
  try{
    const testKey = '__pilot_test__';
    window.localStorage.setItem(testKey,'1');
    window.localStorage.removeItem(testKey);
    return makeLocalAdapter();
  }catch(e){
    return makeMemoryAdapter();
  }
}
function makeStorageAdapter(){
  if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get==='function'){
    storageMode = 'artifact';
    const artifact = window.storage;
    // Wrapped so that if the artifact backend errors at runtime, we drop down
    // to localStorage/memory instead of failing the save outright.
    return {
      async get(key){
        try{
          return await artifact.get(key, false);
        }catch(e){
          console.warn('Artifact storage get failed, falling back:', e);
          storageAdapter = makeLocalOrMemoryAdapter();
          return storageAdapter.get(key);
        }
      },
      async set(key,value){
        try{
          return await artifact.set(key, value, false);
        }catch(e){
          console.warn('Artifact storage set failed, falling back:', e);
          storageAdapter = makeLocalOrMemoryAdapter();
          return storageAdapter.set(key,value);
        }
      },
    };
  }
  return makeLocalOrMemoryAdapter();
}
let storageAdapter = null;

async function loadState(){
  storageAdapter = makeStorageAdapter();
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    if(res && res.value){
      state = JSON.parse(res.value);
      if(!state.ui) state.ui = {selectedProject:'all', kpiSelection: KPI_DEFS.map(k=>k.id)};
      if(!state.ui.kpiSelection) state.ui.kpiSelection = KPI_DEFS.map(k=>k.id);
      if(!state.risks) state.risks=[];
      if(!state.projects) state.projects=[];
      if(!state.phases) state.phases=[];
      state.phases.forEach(p=>{ if(typeof p.critical!=='boolean') p.critical=false; });
      return;
    }
  }catch(e){ /* no data yet, seed below */ }
  state = seedDeps(seedData());
  persist(true);
}
function persist(immediate){
  const dot = document.getElementById('saveDot');
  const txt = document.getElementById('saveText');
  if(dot){dot.classList.remove('error'); dot.classList.add('pending'); txt.textContent='Enregistrement…';}
  clearTimeout(saveTimer);
  const doSave = async ()=>{
    try{
      if(!storageAdapter) storageAdapter = makeStorageAdapter();
      await storageAdapter.set(STORAGE_KEY, JSON.stringify(state));
      if(dot){dot.classList.remove('pending'); dot.classList.remove('error');}
      if(txt) txt.textContent = storageMode==='local' ? 'Enregistré (navigateur)' : storageMode==='memory' ? 'Enregistré (session)' : 'Enregistré';
    }catch(e){
      if(dot){dot.classList.remove('pending'); dot.classList.add('error');}
      if(txt) txt.textContent='Erreur de sauvegarde';
      console.error('Persist error:', e);
    }
  };
  if(immediate) doSave(); else saveTimer = setTimeout(doSave, 500);
}

/* ---------------------------- UTILS ---------------------------- */
function uid(){ return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function fmtDate(dt){ const y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,'0'),d=String(dt.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(dt,n){ const r=new Date(dt); r.setDate(r.getDate()+n); return r; }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
function fmtHuman(s){ if(!s) return '—'; const d=parseDate(s); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtShort(s){ const d=parseDate(s); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }
function fmtMoney(n){ return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(n||0)+' €'; }
/* jsPDF's built-in fonts (helvetica/times/courier) use WinAnsiEncoding
   (roughly cp1252 / Latin-1) and silently corrupt text containing characters
   outside that set — not just that one character, but the whole string can
   come out mangled depending on the PDF viewer. Route ANY text destined for
   doc.text()/autoTable through this first: it swaps the common offenders
   (narrow no-break space, comparison/arrow symbols, etc.) for safe ASCII
   equivalents, then strips anything else outside WinAnsi's range as a
   last-resort safety net so a future added string can't reproduce this bug. */
function pdfSafeText(s){
  return String(s==null?'':s)
    .replace(/[\u202f\u00a0]/g,' ')
    .replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/≠/g,'!=')
    .replace(/→/g,'->').replace(/←/g,'<-')
    /* These ARE supported by jsPDF's standard fonts via WinAnsiEncoding
       (cp1252), but sit outside the \x00-\xFF Latin-1 range checked below
       as Unicode code points, so they must be mapped explicitly first or
       the catch-all strip below would wrongly turn them into '?'. */
    .replace(/€/g,'EUR').replace(/[\u2013\u2014]/g,'-')
    .replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"')
    .replace(/…/g,'...')
    .replace(/[^\x00-\xFF]/g,'?');
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function initials(name){ if(!name) return '?'; return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._tm); showToast._tm=setTimeout(()=>t.classList.remove('show'),2200);
}

function phaseById(id){ return state.phases.find(p=>p.id===id); }

/* ---------------------------- STATUS / CPM / KPI ---------------------------- */
function getPhaseStatus(phase){
  if(phase.progress>=100) return 'done';
  const today = new Date(); today.setHours(0,0,0,0);
  const start = parseDate(phase.start), end = parseDate(phase.end);
  if(today < start) return 'upcoming';
  const totalDays = Math.max(1, daysBetween(phase.start, phase.end));
  const elapsed = clamp(daysBetween(phase.start, fmtDate(today)), 0, totalDays);
  const expected = (elapsed/totalDays)*100;
  const diff = expected - phase.progress;
  if(today > end) return phase.progress>=100?'done':'late';
  if(diff <= 6) return 'ontrack';
  if(diff <= 22) return 'atrisk';
  return 'late';
}
const STATUS_META = {
  ontrack:{label:'Dans les temps', color:'#3ecf8e'},
  atrisk:{label:'À risque', color:'#f5a524'},
  late:{label:'En retard', color:'#f0555c'},
  done:{label:'Terminé', color:'#4d9fff'},
  upcoming:{label:'À venir', color:'#8a94a6'},
};
/* Priority set manually on the phase form. Only Haute/Critique get a visible
   marker on the Gantt (label column) so the chart isn't cluttered — this is
   independent from the auto-computed "chemin critique" (zero-slack) marker. */
const PRIORITY_COLOR = { Basse:null, Moyenne:null, Haute:'#f5a524', Critique:'#f0555c' };

/* Simplified critical-path detection based on fixed dates + dependency chain */
function computeCriticalPhaseIds(projectId){
  const phases = state.phases.filter(p=>p.projectId===projectId);
  if(!phases.length) return new Set();
  const successors = {};
  phases.forEach(p=>successors[p.id]=[]);
  phases.forEach(p=> (p.deps||[]).forEach(depId=>{ if(successors[depId]) successors[depId].push(p.id); }));
  const projectEnd = phases.reduce((m,p)=>{ const pe = parseDate(p.end); return pe>m?pe:m; }, parseDate(phases[0].end));
  const critical = new Set();
  phases.forEach(p=>{
    const succ = successors[p.id];
    let latestFinish;
    if(!succ.length){ latestFinish = projectEnd; }
    else{
      latestFinish = succ.reduce((m,sid)=>{
        const s = phaseById(sid); const st = parseDate(s.start);
        return st<m?st:m;
      }, addDays(projectEnd,3650));
    }
    const slackDays = daysBetween(p.end, fmtDate(latestFinish));
    if(slackDays<=0) critical.add(p.id);
  });
  return critical;
}
/* "Critique" est désormais un choix manuel (case à cocher dans la fiche de la phase).
   L'ancien calcul automatique (marge nulle) rendait critique toute phase sans successeur. */
function allCriticalIds(){
  return new Set(state.phases.filter(p=>p.critical).map(p=>p.id));
}
/* Une phase programmée aujourd'hui (en cours, non terminée) est prioritaire. */
function isActiveToday(p){
  if(p.progress>=100) return false;
  const t = fmtDate(new Date());
  return p.start<=t && p.end>=t;
}

/* Single source of truth for "risque critique": score >= 15 AND not closed.
   A closed risk no longer needs attention regardless of its severity score,
   so it must never be counted here — used by the alerts banner, the KPI
   card, and the KPI PDF export so all three always agree on the same number. */
function isRiskCritical(r){ return (r.probability*r.impact)>=15 && r.status!=='Clos'; }

function computeKPIs(phases){
  const n = phases.length || 1;
  const totalDur = phases.reduce((s,p)=>s+Math.max(1,daysBetween(p.start,p.end)),0) || 1;
  const progress_global = phases.reduce((s,p)=> s + p.progress*Math.max(1,daysBetween(p.start,p.end)), 0)/totalDur;
  const statuses = phases.map(p=>getPhaseStatus(p));
  const phases_ontrack = statuses.filter(s=>s==='ontrack').length;
  const phases_atrisk = statuses.filter(s=>s==='atrisk').length;
  const phases_late = statuses.filter(s=>s==='late').length;
  const phases_done = statuses.filter(s=>s==='done').length;
  const milestones = phases.filter(p=>p.milestone);
  const milestones_reached = milestones.filter(m=>m.progress>=100).length;
  const today = new Date();
  const expectedTotal = phases.reduce((s,p)=>{
    const totalD = Math.max(1,daysBetween(p.start,p.end));
    const elapsed = clamp(daysBetween(p.start, fmtDate(today)),0,totalD);
    return s + (elapsed/totalD)*100*totalD;
  },0);
  const actualTotal = phases.reduce((s,p)=> s + p.progress*Math.max(1,daysBetween(p.start,p.end)), 0);
  const spi = expectedTotal>0 ? actualTotal/expectedTotal : 1;
  const budgetPlanned = phases.reduce((s,p)=>s+(p.budgetPlanned||0),0);
  const budgetActual = phases.reduce((s,p)=>s+(p.budgetActual||0),0);
  const cpi = budgetActual>0 ? budgetPlanned/budgetActual : 1;
  const lateDelays = phases.filter(p=>getPhaseStatus(p)==='late').map(p=>{
    const totalD=Math.max(1,daysBetween(p.start,p.end));
    const elapsed = clamp(daysBetween(p.start,fmtDate(today)),0,totalD);
    const expected=(elapsed/totalD)*100;
    const ratio = (expected-p.progress)/100;
    return Math.round(ratio*totalD);
  });
  const avg_delay = lateDelays.length? Math.round(lateDelays.reduce((a,b)=>a+b,0)/lateDelays.length) : 0;
  const critIds = new Set(phases.filter(p=>p.critical).map(p=>p.id));
  const risksAll = state.risks.filter(r=> phases.some(p=>p.id===r.phaseId));
  const risks_open = risksAll.filter(r=>r.status==='Ouvert').length;
  const risks_critical = risksAll.filter(isRiskCritical).length;
  return {
    progress_global, phases_ontrack, phases_atrisk, phases_late, phases_done,
    milestones_reached, milestones_total: milestones.length,
    spi, cpi, avg_delay, critical_count: critIds.size,
    budget_planned: budgetPlanned, budget_actual: budgetActual,
    budget_consumed: budgetPlanned>0 ? (budgetActual/budgetPlanned*100) : 0,
    budget_variance: budgetPlanned - budgetActual,
    risks_open, risks_critical, phases_total: phases.length,
  };
}

  const overBudget = phases.filter(p=>p.budgetPlanned>0 && p.budgetActual > p.budgetPlanned*1.1);
  const criticalRisks = state.risks.filter(r=> phases.some(p=>p.id===r.phaseId) && isRiskCritical(r));
  const chips = [];
  if(lateOnes.length) chips.push(`<div class="alert-chip late">⚠ ${lateOnes.length} phase(s) en retard</div>`);
  if(upcomingMilestones.length) chips.push(`<div class="alert-chip milestone">◆ ${upcomingMilestones.length} jalon(s) à échéance sous 7 jours</div>`);
  if(overBudget.length) chips.push(`<div class="alert-chip budget">€ ${overBudget.length} phase(s) en dépassement budgétaire (+10%)</div>`);
  if(criticalRisks.length) chips.push(`<div class="alert-chip risk">☢ ${criticalRisks.length} risque(s) critique(s) actif(s)</div>`);
  if(!chips.length) chips.push(`<div class="alert-chip ok">✓ Aucune alerte — le portefeuille est sous contrôle</div>`);

/* ---------------------------- GANTT ---------------------------- */
function buildGanttSVG(phases, opts){
  opts = opts || {};
  const zoom = opts.zoom || ganttZoom;
  const forPrint = !!opts.forPrint;
  const rangeStart = opts.rangeStart, rangeEnd = opts.rangeEnd;
  if(!phases.length) return null;

  let minD = phases.reduce((m,p)=> parseDate(p.start)<m?parseDate(p.start):m, parseDate(phases[0].start));
  let maxD = phases.reduce((m,p)=> parseDate(p.end)>m?parseDate(p.end):m, parseDate(phases[0].end));
  if(rangeStart) minD = parseDate(rangeStart);
  if(rangeEnd) maxD = parseDate(rangeEnd);
  minD = addDays(minD,-2); maxD = addDays(maxD,2);
  const totalDays = Math.max(1, daysBetween(fmtDate(minD), fmtDate(maxD)));

  const dayW = zoom==='day' ? 34 : zoom==='week' ? 15 : 6.2;
  const rowH = 34;
  const labelW = forPrint? 260 : 240;
  const headH = 52;
  const chartW = totalDays*dayW;
  const width = labelW + chartW + 20;
  const height = headH + phases.length*rowH + 20;
  const critIds = allCriticalIds();

  const xOf = (dateStr)=> labelW + daysBetween(fmtDate(minD), dateStr)*dayW;

  // month/week header
  let headerEls = '';
  let cursor = new Date(minD);
  cursor.setDate(1);
  const months = [];
  let cm = new Date(minD.getFullYear(), minD.getMonth(), 1);
  while(cm <= maxD){
    months.push(new Date(cm));
    cm = new Date(cm.getFullYear(), cm.getMonth()+1, 1);
  }
  months.forEach(m=>{
    const segStart = m < minD ? minD : m;
    const nextM = new Date(m.getFullYear(), m.getMonth()+1, 1);
    const segEnd = nextM > maxD ? maxD : nextM;
    const x1 = xOf(fmtDate(segStart)), x2 = xOf(fmtDate(segEnd));
    if(x2<=x1) return;
    headerEls += `<rect x="${x1}" y="0" width="${x2-x1}" height="26" fill="${forPrint?'#eef2f7':'var(--bg-panel-2)'}" stroke="${forPrint?'#d7dee6':'#2c3543'}" stroke-width="1"/>
      <text x="${x1+8}" y="17" font-size="11" font-weight="700" fill="${forPrint?'#33404f':'#e9edf3'}" font-family="Barlow Condensed, sans-serif">${m.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).toUpperCase()}</text>`;
  });
  // day/week ticks
  if(zoom!=='month'){
    let d = new Date(minD);
    while(d<=maxD){
      const x = xOf(fmtDate(d));
      const isMonday = d.getDay()===1;
      if(zoom==='day' || isMonday){
        headerEls += `<line x1="${x}" y1="26" x2="${x}" y2="${height}" stroke="${forPrint?'#e7ebf0':'#232b38'}" stroke-width="1"/>`;
        headerEls += `<text x="${x+3}" y="40" font-size="9.5" fill="${forPrint?'#7a8794':'#6d7889'}" font-family="IBM Plex Mono, monospace">${d.getDate()}</text>`;
      }
      d = addDays(d,1);
    }
  } else {
    // week gridlines lightly
    let d=new Date(minD);
    while(d<=maxD){ if(d.getDay()===1){ const x=xOf(fmtDate(d)); headerEls+=`<line x1="${x}" y1="26" x2="${x}" y2="${height}" stroke="${forPrint?'#eef1f4':'#1e2733'}" stroke-width="1"/>`; } d=addDays(d,1); }
  }

  // today line
  const todayStr = fmtDate(new Date());
  let todayLine = '';
  if(parseDate(todayStr)>=minD && parseDate(todayStr)<=maxD){
    const tx = xOf(todayStr);
    todayLine = `<line x1="${tx}" y1="0" x2="${tx}" y2="${height}" stroke="#f0555c" stroke-width="1.6" stroke-dasharray="4,3"/>
      <text x="${tx+4}" y="12" font-size="9.5" fill="#f0555c" font-weight="700" font-family="IBM Plex Mono, monospace">AUJOURD'HUI</text>`;
  }

  // label column bg + separator
  let rowsSvg = '';
  phases.forEach((p,i)=>{
    const y = headH + i*rowH;
    let rowBg = i%2===0 ? (forPrint?'#ffffff':'transparent') : (forPrint?'#f7f9fb':'rgba(255,255,255,.012)');
    if(isActiveToday(p)) rowBg = forPrint?'#fff8e6':'rgba(62,207,142,.07)';
    rowsSvg += `<rect x="0" y="${y}" width="${width}" height="${rowH}" fill="${rowBg}"/>`;
    const proj = projectById(p.projectId);
    const isCrit = critIds.has(p.id);
    const nameColor = forPrint? '#1c2531':'#e9edf3';
    const shortName = p.name.length>28? p.name.slice(0,27)+'…' : p.name;
    const prioColor = PRIORITY_COLOR[p.priority];
    rowsSvg += `<text x="${prioColor?24:14}" y="${y+rowH/2+4}" font-size="12" fill="${nameColor}" font-family="Inter, sans-serif" font-weight="500">${escapeHtml(shortName)}</text>`;
    if(prioColor){
      rowsSvg += `<rect x="12" y="${y+rowH/2-5}" width="6" height="10" rx="1.5" fill="${prioColor}"><title>Priorité : ${escapeHtml(p.priority)}</title></rect>`;
    }
    rowsSvg += `<circle cx="${labelW-14}" cy="${y+rowH/2}" r="3.5" fill="${proj?proj.color:'#888'}"/>`;

    const bx = xOf(p.start), bx2 = xOf(p.end);
    const bw = Math.max(bx2-bx, zoom==='month'?4:8);
    const barY = y + 7, barH = rowH-14;

    if(p.milestone){
      const cx = bx, cy = y+rowH/2, s=8;
      const fill = p.progress>=100 ? '#3ecf8e' : (isCrit? '#f5a524':'#4d9fff');
      rowsSvg += `<rect x="${cx-s}" y="${cy-s}" width="${s*2}" height="${s*2}" fill="${fill}" stroke="${forPrint?'#33404f':'#0d1116'}" stroke-width="1.3" transform="rotate(45 ${cx} ${cy})"/>`;
    } else {
      const statusColor = STATUS_META[getPhaseStatus(p)].color;
      rowsSvg += `<rect x="${bx}" y="${barY}" width="${bw}" height="${barH}" rx="5" fill="${forPrint?'#e2e7ed':'#232b38'}" stroke="${isCrit? '#f5a524':(forPrint?'#c8d0d9':'#333e4d')}" stroke-width="${isCrit?2:1}" ${isCrit && !forPrint ? 'stroke-dasharray="5,3"':''}/>`;
      const fillW = Math.max(0, bw*clamp(p.progress,0,100)/100);
      rowsSvg += `<rect x="${bx}" y="${barY}" width="${fillW}" height="${barH}" rx="5" fill="${proj?proj.color:statusColor}" opacity="0.92"/>`;
      if(bw>34){
        rowsSvg += `<text x="${bx+bw/2}" y="${barY+barH/2+3.5}" font-size="9.5" text-anchor="middle" fill="${forPrint?'#33404f':'#0b1016'}" font-weight="700" font-family="IBM Plex Mono, monospace">${Math.round(p.progress)}%</text>`;
      }
      if(isCrit){
        rowsSvg += `<text x="${bx}" y="${barY-3}" font-size="8.5" fill="#f5a524" font-weight="700" font-family="Inter, sans-serif">CRITIQUE</text>`;
      }
    }

    // dependency connectors
    (p.deps||[]).forEach(depId=>{
      const dep = phaseById(depId);
      if(!dep) return;
      const depIdx = phases.findIndex(x=>x.id===depId);
      if(depIdx<0) return;
      const dy = headH + depIdx*rowH + rowH/2;
      const dx = dep.milestone? xOf(dep.end) : xOf(dep.end);
      const sx = p.milestone? xOf(p.start) : xOf(p.start);
      const sy = y+rowH/2;
      const midX = dx + 10;
      rowsSvg += `<path d="M ${dx} ${dy} L ${midX} ${dy} L ${midX} ${sy} L ${sx} ${sy}" fill="none" stroke="${forPrint?'#b7c0ca':'#3a4454'}" stroke-width="1.2" marker-end="url(#arrow)"/>`;
    });
  });

  const bgFill = forPrint? '#ffffff':'transparent';
  const svg = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${forPrint?'#b7c0ca':'#3a4454'}"/></marker></defs>
    <rect x="0" y="0" width="${width}" height="${height}" fill="${bgFill}"/>
    ${rowsSvg}
    <rect x="0" y="0" width="${labelW}" height="${height}" fill="${forPrint?'rgba(255,255,255,.0)':'rgba(18,22,29,.55)'}"/>
    ${headerEls}
    ${todayLine}
    <line x1="${labelW}" y1="0" x2="${labelW}" y2="${height}" stroke="${forPrint?'#d7dee6':'#2c3543'}" stroke-width="1.4"/>
  </svg>`;
  return {svg, width, height};
}

function kpiCardMeta(id,k){
  switch(id){
    case 'progress_global': return {value:Math.round(k.progress_global)+'%', tone: k.progress_global>=70?'k-good':k.progress_global>=40?'k-warn':'k-bad', bar:k.progress_global, desc:'Pondéré par la durée des phases'};
    case 'phases_ontrack': return {value:k.phases_ontrack+' / '+k.phases_total, tone:'k-good', desc:'Phases respectant le planning'};
    case 'phases_atrisk': return {value:k.phases_atrisk+' / '+k.phases_total, tone:k.phases_atrisk>0?'k-warn':'k-good', desc:'Écart entre 6 et 22 pts vs prévu'};
    case 'phases_late': return {value:k.phases_late+' / '+k.phases_total, tone:k.phases_late>0?'k-bad':'k-good', desc:'Retard significatif détecté'};
    case 'phases_done': return {value:k.phases_done+' / '+k.phases_total, tone:'k-good', desc:'Phases soldées à 100%'};
    case 'milestones_reached': return {value:k.milestones_reached+' / '+k.milestones_total, tone:'k-good', desc:'Jalons clés atteints'};
    case 'spi': return {value:k.spi.toFixed(2), tone:k.spi>=0.95?'k-good':k.spi>=0.8?'k-warn':'k-bad', desc:'>1 en avance, <1 en retard sur planning'};
    case 'cpi': return {value:k.cpi.toFixed(2), tone:k.cpi>=0.95?'k-good':k.cpi>=0.8?'k-warn':'k-bad', desc:'>1 sous le budget, <1 en dépassement'};
    case 'avg_delay': return {value:k.avg_delay+' j', tone:k.avg_delay===0?'k-good':k.avg_delay<10?'k-warn':'k-bad', desc:'Retard moyen des phases concernées'};
    case 'critical_count': return {value:String(k.critical_count), tone:k.critical_count>0?'k-warn':'k-good', desc:'Aucune marge — impact direct sur la date de fin'};
    case 'budget_consumed': return {value:Math.round(k.budget_consumed)+'%', tone:k.budget_consumed<=100?'k-good':'k-bad', bar:Math.min(100,k.budget_consumed), desc:fmtMoney(k.budget_actual)+' / '+fmtMoney(k.budget_planned)};
    case 'budget_variance': return {value:(k.budget_variance>=0?'+ ':'- ')+fmtMoney(Math.abs(k.budget_variance)), tone:k.budget_variance>=0?'k-good':'k-bad', desc:k.budget_variance>=0?'Sous le budget prévu':'Dépassement du budget prévu'};
    case 'risks_open': return {value:String(k.risks_open), tone:k.risks_open===0?'k-good':'k-warn', desc:'Risques actifs à traiter'};
    case 'risks_critical': return {value:String(k.risks_critical), tone:k.risks_critical===0?'k-good':'k-bad', desc:'Score probabilité × impact >= 15'};
  }
}
function buildSCurve(phases){
  if(!phases.length) return '';
  const minD = phases.reduce((m,p)=>parseDate(p.start)<m?parseDate(p.start):m, parseDate(phases[0].start));
  const maxD = phases.reduce((m,p)=>parseDate(p.end)>m?parseDate(p.end):m, parseDate(phases[0].end));
  const totalDur = phases.reduce((s,p)=>s+Math.max(1,daysBetween(p.start,p.end)),0)||1;
  const totalDays = Math.max(1,daysBetween(fmtDate(minD),fmtDate(maxD)));
  const steps = Math.min(40, Math.max(8,Math.round(totalDays/7)));
  const pts=[];
  for(let i=0;i<=steps;i++){
    const t = addDays(minD, Math.round(totalDays*i/steps));
    const ts = fmtDate(t);
    let planned=0, actual=0;
    phases.forEach(p=>{
      const dur = Math.max(1,daysBetween(p.start,p.end));
      const w = dur/totalDur;
      if(parseDate(ts) >= parseDate(p.end)) planned += 100*w;
      else if(parseDate(ts) > parseDate(p.start)) planned += (daysBetween(p.start,ts)/dur)*100*w;
      if(parseDate(ts) >= parseDate(p.end)) actual += (p.progress>=100? 100*w : p.progress*w);
      else if(parseDate(ts) > parseDate(p.start)) actual += Math.min(p.progress, (daysBetween(p.start,ts)/dur)*100)*w;
    });
    pts.push({x:i/steps, planned:clamp(planned,0,100), actual:clamp(actual,0,100), label:t});
  }
  const W=560,H=200,pad=32;
  const xs = i=> pad + i*(W-pad*2);
  const ys = v=> H-24 - (v/100)*(H-50);
  const pathFor = key => pts.map((p,i)=>`${i===0?'M':'L'} ${xs(p.x).toFixed(1)} ${ys(p[key]).toFixed(1)}`).join(' ');
  const gridY = [0,25,50,75,100].map(v=>`<line x1="${pad}" y1="${ys(v)}" x2="${W-pad}" y2="${ys(v)}" stroke="#232b38" stroke-width="1"/><text x="4" y="${ys(v)+3}" font-size="9" fill="#6d7889" font-family="IBM Plex Mono">${v}</text>`).join('');
  const lastPlanned = pts[pts.length-1], lastActual=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="200">
    ${gridY}
    <path d="${pathFor('planned')}" fill="none" stroke="#6d7889" stroke-width="2" stroke-dasharray="5,4"/>
    <path d="${pathFor('actual')}" fill="none" stroke="#4d9fff" stroke-width="2.5"/>
    <circle cx="${xs(lastActual.x)}" cy="${ys(lastActual.actual)}" r="3.5" fill="#4d9fff"/>
    <text x="${W-pad-90}" y="16" font-size="10.5" fill="#6d7889" font-family="Inter">┄┄ Prévu</text>
    <text x="${W-pad-40}" y="16" font-size="10.5" fill="#4d9fff" font-family="Inter" font-weight="600">— Réel</text>
  </svg>`;
}
function buildWorkloadChart(phases){
  const load = {};
  phases.forEach(p=>{ const r=p.responsible||'Non assigné'; load[r]=(load[r]||0)+Math.max(1,daysBetween(p.start,p.end)); });
  const entries = Object.entries(load).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!entries.length) return '<div class="empty-state" style="padding:20px">Aucune donnée</div>';
  const max = Math.max(...entries.map(e=>e[1]));
  return entries.map(([name,days])=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="width:110px;font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
      <div style="flex:1;background:var(--bg-raised);border-radius:5px;height:16px;overflow:hidden">
        <div style="width:${(days/max*100).toFixed(0)}%;height:100%;background:linear-gradient(90deg,#4d9fff,#37c9c1);display:flex;align-items:center;justify-content:flex-end;padding-right:6px">
        </div>
      </div>
      <div style="width:52px;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--text-2)">${days} j</div>
    </div>`).join('');
}

  const cardsHtml = KPI_DEFS.map(def=>{
    const m = kpiCardMeta(def.id,k);
    const on = selection.has(def.id);
    return `<div class="kpi-card ${on?'':'excluded'}" data-kpicard="${def.id}">
      <input type="checkbox" class="kchk" data-kpichk="${def.id}" ${on?'checked':''}>
      <div class="klabel">${def.label}</div>
      <div class="kvalue ${m.tone}">${m.value}</div>
      <div class="ktrend">${m.desc}</div>
      ${m.bar!==undefined?`<div class="kbar"><div style="width:${clamp(m.bar,0,100)}%;background:currentColor" class="${m.tone}"></div></div>`:''}
    </div>`;
  }).join('');

  document.getElementById('contentPad').innerHTML = `
    ${renderAlerts()}
    <div class="panel" style="margin-bottom:16px">
      <div class="kpi-toolbar">
        <div><strong>Indicateurs</strong> — cochez ceux à inclure dans le rapport PDF (${selection.size}/${KPI_DEFS.length} sélectionnés)</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-outline" id="kpiSelAll">Tout sélectionner</button>
          <button class="btn btn-sm btn-outline" id="kpiSelNone">Tout désélectionner</button>
        </div>
      </div>
      <div class="kpi-grid">${cardsHtml}</div>
    </div>
    <div class="charts-grid">
      <div class="chart-box">
        <h3>Courbe en S — avancement cumulé</h3>
        <div class="cdesc">Comparaison de l'avancement prévu (pondéré durée) vs réel dans le temps</div>
        ${buildSCurve(phases)}
      </div>
      <div class="chart-box">
        <h3>Charge par responsable</h3>
        <div class="cdesc">Total de jours planifiés (toutes phases) par personne</div>
        ${buildWorkloadChart(phases)}
      </div>
    </div>`;

  document.getElementById('btnExportKpi').addEventListener('click', ()=>openExportKpiModal());
  document.getElementById('kpiSelAll').addEventListener('click', ()=>{ state.ui.kpiSelection = KPI_DEFS.map(d=>d.id); persist(); renderKpiTab(); });
  document.getElementById('kpiSelNone').addEventListener('click', ()=>{ state.ui.kpiSelection = []; persist(); renderKpiTab(); });
  document.querySelectorAll('[data-kpichk]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.dataset.kpichk;
      const set = new Set(state.ui.kpiSelection);
      if(el.checked) set.add(id); else set.delete(id);
      state.ui.kpiSelection = [...set];
      persist();
      el.closest('.kpi-card').classList.toggle('excluded', !el.checked);
      document.querySelector('.kpi-toolbar > div').innerHTML = `<strong>Indicateurs</strong> — cochez ceux à inclure dans le rapport PDF (${state.ui.kpiSelection.length}/${KPI_DEFS.length} sélectionnés)`;
    });
  });
}

/* ---------------------------- PHASE MODAL ---------------------------- */
function openPhaseModal(phaseId){
  const editing = !!phaseId;
  const p = editing ? phaseById(phaseId) : {
    id:null, projectId: state.ui.selectedProject!=='all'?state.ui.selectedProject:(state.projects[0]?state.projects[0].id:''),
    name:'', start:fmtDate(new Date()), end:fmtDate(addDays(new Date(),10)), progress:0,
    responsible:'', budgetPlanned:0, budgetActual:0, priority:'Moyenne', milestone:false, critical:false, deps:[], notes:''
  };
  if(!state.projects.length){ showToast('Créez d\'abord un projet'); return; }
  const otherPhases = state.phases.filter(ph=>ph.projectId===p.projectId && ph.id!==p.id);
  const risksForPhase = editing ? state.risks.filter(r=>r.phaseId===p.id) : [];

  openModal(`
  <div class="modal wide">
    <div class="modal-head"><h3>${editing?'Modifier la phase':'Nouvelle phase'}</h3><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full"><label>Nom de la phase</label><input id="f_name" value="${escapeHtml(p.name)}" placeholder="Ex. Installation des équipements"></div>
        <div class="field"><label>Projet</label>
          <select id="f_project">${state.projects.map(pr=>`<option value="${pr.id}" ${pr.id===p.projectId?'selected':''}>${escapeHtml(pr.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Responsable</label><input id="f_resp" value="${escapeHtml(p.responsible)}" placeholder="Nom du pilote"></div>
        <div class="field"><label>Date de début</label><input type="date" id="f_start" value="${p.start}"></div>
        <div class="field"><label>Date de fin</label><input type="date" id="f_end" value="${p.end}"></div>
        <div class="field"><label>Avancement (%)</label><input type="number" id="f_progress" min="0" max="100" value="${p.progress}"></div>
        <div class="field"><label>Priorité</label>
          <select id="f_priority">${['Basse','Moyenne','Haute','Critique'].map(pr=>`<option ${pr===p.priority?'selected':''}>${pr}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Budget prévu (€)</label><input type="number" id="f_budgetp" value="${p.budgetPlanned}"></div>
        <div class="field"><label>Budget réel consommé (€)</label><input type="number" id="f_budgeta" value="${p.budgetActual}"></div>
        <div class="field full checkbox-row"><input type="checkbox" id="f_critical" ${p.critical?'checked':''}><label style="text-transform:none;font-weight:500;color:var(--text-1);font-size:13px">Phase critique (marquée sur le Gantt et comptée dans les KPI)</label></div>
        <div class="field full checkbox-row"><input type="checkbox" id="f_milestone" ${p.milestone?'checked':''}><label style="text-transform:none;font-weight:500;color:var(--text-1);font-size:13px">Cette phase est un jalon (date unique)</label></div>
        <div class="field full">
          <label>Dépendances (phases prédécesseurs dans le même projet)</label>
          <div class="chip-select" id="f_deps">
            ${otherPhases.length? otherPhases.map(op=>`<button type="button" class="chip-opt ${((p.deps||[]).includes(op.id))?'on':''}" data-dep="${op.id}">${escapeHtml(op.name)}</button>`).join('') : '<span class="hint">Aucune autre phase dans ce projet</span>'}
          </div>
        </div>
        <div class="field full"><label>Notes</label><textarea id="f_notes" placeholder="Contexte, contraintes, jalons intermédiaires…">${escapeHtml(p.notes||'')}</textarea></div>
      </div>

      <div class="section-sub">☢ Risques associés</div>
      <div class="mini-list" id="phaseRisksList">
        ${risksForPhase.length? risksForPhase.map(r=>`<div class="mini-item"><div class="body"><strong>${escapeHtml(r.description)}</strong><div class="hint" style="margin-top:3px">Probabilité ${r.probability}/5 · Impact ${r.impact}/5 · ${r.status}</div></div></div>`).join('') : '<div class="hint">Aucun risque lié. Ajoutez-en depuis l\'onglet Risques.</div>'}
      </div>
    </div>
    <div class="modal-foot">
      ${editing?`<button class="btn btn-outline" id="btnDeletePhase" style="margin-right:auto;color:var(--red);border-color:rgba(240,85,92,.4)">Supprimer</button>`:''}
      <button class="btn btn-outline modal-close">Annuler</button>
      <button class="btn btn-primary" id="btnSavePhase">${editing?'Enregistrer':'Créer la phase'}</button>
    </div>
  </div>`);

  let currentDeps = new Set(p.deps||[]);
  document.querySelectorAll('#f_deps [data-dep]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.dep;
      if(currentDeps.has(id)) currentDeps.delete(id); else currentDeps.add(id);
      btn.classList.toggle('on');
    });
  });
  document.getElementById('f_project').addEventListener('change', ()=>{ openPhaseModal(phaseId); }); // refresh deps list on project switch (new phase only mostly)

  if(editing){
    document.getElementById('btnDeletePhase').addEventListener('click', ()=>{
      if(!confirm('Supprimer cette phase ?')) return;
      state.phases = state.phases.filter(x=>x.id!==p.id);
      state.phases.forEach(x=>{ x.deps = (x.deps||[]).filter(d=>d!==p.id); });
      state.risks = state.risks.filter(r=>r.phaseId!==p.id);
      persist(); closeModal(); renderAll(); showToast('Phase supprimée');
    });
  }

  document.getElementById('btnSavePhase').addEventListener('click', ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ showToast('Le nom de la phase est requis'); return; }
    let start = document.getElementById('f_start').value;
    let end = document.getElementById('f_end').value;
    const isMilestone = document.getElementById('f_milestone').checked;
    if(isMilestone) end = start;
    if(parseDate(end) < parseDate(start)){ showToast('La date de fin doit être après la date de début'); return; }
    const data = {
      name, projectId: document.getElementById('f_project').value,
      responsible: document.getElementById('f_resp').value.trim(),
      start, end,
      progress: clamp(Number(document.getElementById('f_progress').value)||0,0,100),
      priority: document.getElementById('f_priority').value,
      budgetPlanned: Number(document.getElementById('f_budgetp').value)||0,
      budgetActual: Number(document.getElementById('f_budgeta').value)||0,
      milestone: isMilestone,
      critical: document.getElementById('f_critical').checked,
      deps: [...currentDeps],
      notes: document.getElementById('f_notes').value,
    };
    if(editing){ Object.assign(p, data); }
    else { state.phases.push(Object.assign({id:uid()}, data)); }
    persist(); closeModal(); renderAll();
    showToast(editing?'Phase mise à jour':'Phase créée');
  });
}

function generateKpiPdf(chosenIds, phases, scopeName){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const k = computeKPIs(phases);
  const pageW = doc.internal.pageSize.getWidth();
  let y = 50;

  doc.setFillColor(18,22,29); doc.rect(0,0,pageW,80,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text('Rapport KPI — Pilotage de projet', 40, 34);
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(180,190,205);
  doc.text(`Périmètre : ${pdfSafeText(scopeName)}   ·   Généré le ${new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}`, 40, 54);
  y = 106;

  const cardW = (pageW-80-24)/3, cardH = 74;
  const TONE_RGB = { 'k-good':[62,207,142], 'k-warn':[214,138,10], 'k-bad':[224,60,68] };
  let col=0, row=0;
  chosenIds.forEach((id)=>{
    const def = KPI_DEFS.find(d=>d.id===id);
    const m = kpiCardMeta(id,k);
    const x = 40 + col*(cardW+12);
    const yy = y + row*(cardH+12);
    doc.setDrawColor(225,229,235); doc.setFillColor(250,251,252);
    doc.roundedRect(x,yy,cardW,cardH,6,6,'FD');
    doc.setTextColor(120,130,145); doc.setFontSize(8.3); doc.setFont('helvetica','bold');
    const label = def.label.toUpperCase();
    doc.text(doc.splitTextToSize(pdfSafeText(label), cardW-16), x+12, yy+18);
    const toneRgb = TONE_RGB[m.tone] || [30,38,48];
    doc.setTextColor(toneRgb[0],toneRgb[1],toneRgb[2]); doc.setFontSize(19); doc.setFont('helvetica','bold');
    doc.text(pdfSafeText(m.value), x+12, yy+44);
    doc.setTextColor(140,148,160); doc.setFontSize(7.6); doc.setFont('helvetica','normal');
    doc.text(doc.splitTextToSize(pdfSafeText(m.desc), cardW-16), x+12, yy+58);
    col++; if(col===3){ col=0; row++; }
  });
  const rowsUsed = Math.ceil(chosenIds.length/3);
  y = y + rowsUsed*(cardH+12) + 20;

  if(y > 650) { doc.addPage(); y = 50; }
  doc.setTextColor(30,38,48); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('Détail des phases', 40, y); y+=10;

  const rows = phases.slice().sort((a,b)=>parseDate(a.start)-parseDate(b.start)).map(p=>{
    const st = getPhaseStatus(p);
    return [pdfSafeText(p.name), pdfSafeText(projectById(p.projectId)?projectById(p.projectId).name:''), fmtHuman(p.start), fmtHuman(p.end), Math.round(p.progress)+'%', STATUS_META[st].label, pdfSafeText(p.responsible||'—'), pdfSafeText(fmtMoney(p.budgetActual)+' / '+fmtMoney(p.budgetPlanned))];
  });
  doc.autoTable({
    startY: y+8, margin:{left:40,right:40},
    head: [['Phase','Projet','Début','Fin','Avanc.','Statut','Responsable','Budget']],
    body: rows,
    styles:{fontSize:8, cellPadding:5, textColor:[40,48,58]},
    headStyles:{fillColor:[26,32,41], textColor:255, fontSize:8},
    alternateRowStyles:{fillColor:[247,249,251]},
  });

  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFontSize(8); doc.setTextColor(160,168,180);
    doc.text(`PILOT — Rapport de pilotage · page ${i}/${pageCount}`, 40, doc.internal.pageSize.getHeight()-20);
  }
  doc.save(`rapport-kpi-${scopeName.replace(/\s+/g,'_')}-${fmtDate(new Date())}.pdf`);
  showToast('PDF des KPI généré');
}

/* ---------------------------- EXPORT GANTT (PDF) ---------------------------- */
function openExportGanttModal(){
  const phases = visiblePhases();
  if(!phases.length){ showToast('Aucune phase à exporter'); return; }
  const minD = phases.reduce((m,p)=>parseDate(p.start)<m?parseDate(p.start):m, parseDate(phases[0].start));
  const maxD = phases.reduce((m,p)=>parseDate(p.end)>m?parseDate(p.end):m, parseDate(phases[0].end));
  const scopeName = state.ui.selectedProject==='all' ? 'Tous les projets' : projectById(state.ui.selectedProject).name;

  openModal(`
  <div class="modal">
    <div class="modal-head"><h3>Exporter le macro planning</h3><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div class="field full"><label>Périmètre</label><input value="${escapeHtml(scopeName)}" disabled></div>
      <div class="range-row" style="margin-top:14px">
        <div class="field"><label>Du</label><input type="date" id="exp_start" value="${fmtDate(minD)}"></div>
        <div class="field"><label>Au</label><input type="date" id="exp_end" value="${fmtDate(maxD)}"></div>
      </div>
      <div class="field full" style="margin-top:14px">
        <label>Échelle</label>
        <div class="seg" style="width:fit-content">
          <button type="button" data-ez="week" class="active">Semaine</button>
          <button type="button" data-ez="month">Mois</button>
        </div>
      </div>
      <p class="hint" style="margin-top:14px">Seules les phases actives sur la période sélectionnée seront incluses dans le PDF (format A4 paysage, plusieurs pages si nécessaire).</p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline modal-close">Annuler</button>
      <button class="btn btn-primary" id="btnDoExportGantt">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        Générer le PDF
      </button>
    </div>
  </div>`);

  let expZoom='week';
  document.querySelectorAll('[data-ez]').forEach(b=>b.addEventListener('click', ()=>{
    document.querySelectorAll('[data-ez]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); expZoom=b.dataset.ez;
  }));

  document.getElementById('btnDoExportGantt').addEventListener('click', async ()=>{
    const rs = document.getElementById('exp_start').value, re = document.getElementById('exp_end').value;
    if(parseDate(re) < parseDate(rs)){ showToast('Période invalide'); return; }
    const inRange = phases.filter(p => parseDate(p.end) >= parseDate(rs) && parseDate(p.start) <= parseDate(re));
    if(!inRange.length){ showToast('Aucune phase sur cette période'); return; }
    closeModal();
    showToast('Génération du PDF en cours…');
    await generateGanttPdf(inRange, rs, re, expZoom, scopeName);
  });
}

async function generateGanttPdf(phases, rangeStart, rangeEnd, zoom, scopeName){
  const sorted = phases.slice().sort((a,b)=>parseDate(a.start)-parseDate(b.start));
  const g = buildGanttSVG(sorted, {zoom, forPrint:true, rangeStart, rangeEnd});
  const target = document.getElementById('printTarget');
  target.innerHTML = `<div style="width:${g.width}px;padding:20px 20px 30px;font-family:Inter,sans-serif;background:#fff">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;color:#12161d">Macro planning — ${escapeHtml(scopeName)}</div>
        <div style="font-size:11px;color:#6d7889;margin-top:2px">Période : ${fmtHuman(rangeStart)} → ${fmtHuman(rangeEnd)} · Généré le ${new Date().toLocaleDateString('fr-FR')}</div>
      </div>
    </div>
    ${g.svg}
  </div>`;
  await new Promise(r=>setTimeout(r,60));
  const el = target.firstElementChild;
  const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff'});
  target.innerHTML='';

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4', orientation:'landscape'});
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 24;
  const usableW = pageW - margin*2;
  const imgWpx = canvas.width, imgHpx = canvas.height;
  const scaleToPage = usableW/imgWpx;
  const pageContentHpx = (pageH - margin*2) / scaleToPage;

  let offsetY = 0, page=0;
  while(offsetY < imgHpx){
    const sliceH = Math.min(pageContentHpx, imgHpx-offsetY);
    const sliceCanvas = document.createElement('canvas');
    sliceCanvas.width = imgWpx; sliceCanvas.height = sliceH;
    const ctx = sliceCanvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,imgWpx,sliceH);
    ctx.drawImage(canvas, 0, offsetY, imgWpx, sliceH, 0, 0, imgWpx, sliceH);
    const imgData = sliceCanvas.toDataURL('image/png');
    if(page>0) doc.addPage();
    doc.addImage(imgData, 'PNG', margin, margin, usableW, sliceH*scaleToPage);
    offsetY += sliceH; page++;
  }
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFontSize(8); doc.setTextColor(150,150,150);
    doc.text(`PILOT — page ${i}/${pageCount}`, margin, pageH-10);
  }
  doc.save(`macro-planning-${scopeName.replace(/\s+/g,'_')}-${fmtDate(new Date())}.pdf`);
  showToast('PDF du planning généré');
}

/* ---------------------------- ROUTER / INIT ---------------------------- */
let currentTab = 'planning';
function renderAll(){
  try{
    renderSidebar();
    document.querySelectorAll('.nav-btn[data-tab]').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
    if(currentTab==='planning') renderPlanningTab();
    else if(currentTab==='phases') renderPhasesTab();
    else if(currentTab==='risks') renderRisksTab();
    else if(currentTab==='kpi') renderKpiTab();
  }catch(err){
    console.error('Render error:', err);
    const pad = document.getElementById('contentPad');
    if(pad){
      pad.innerHTML = `<div class="panel" style="padding:26px">
        <div style="font-family:var(--font-display);font-size:19px;color:var(--red);margin-bottom:8px">Un problème d'affichage est survenu</div>
        <div style="color:var(--text-2);font-size:13px;margin-bottom:14px">L'onglet n'a pas pu s'afficher correctement. Vos données ne sont pas perdues.</div>
        <div style="font-family:var(--font-mono);font-size:11.5px;color:var(--text-3);background:var(--bg-panel-2);padding:10px;border-radius:6px;white-space:pre-wrap">${escapeHtml(err && err.message || String(err))}</div>
        <button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="location.reload()">Recharger l'outil</button>
      </div>`;
    }
  }
}

/* ---------------------------- MOBILE SIDEBAR DRAWER ---------------------------- */
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('open');
  document.body.classList.add('sidebar-lock');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
  document.body.classList.remove('sidebar-lock');
}

function setupEvents(){
  document.getElementById('menuToggle').addEventListener('click', openSidebar);
  document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);
  // Si on repasse en largeur desktop pendant que le tiroir est ouvert, on le referme proprement
  window.addEventListener('resize', ()=>{
    if(window.innerWidth > 900) closeSidebar();
  });
  document.querySelectorAll('.nav-btn[data-tab]').forEach(b=>{
    b.addEventListener('click', ()=>{ currentTab=b.dataset.tab; renderAll(); closeSidebar(); });
  });
  document.getElementById('addProjectBtn').addEventListener('click', openProjectModal);
  document.getElementById('exportJsonBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `pilot-data-${fmtDate(new Date())}.json`;
    a.click();
    showToast('Données exportées en JSON');
  });
  document.getElementById('importJsonBtn').addEventListener('click', ()=>document.getElementById('importFileInput').click());
  document.getElementById('importFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.projects || !data.phases) throw new Error('format invalide');
        if(!confirm('Importer ces données remplacera le contenu actuel. Continuer ?')) return;
        state = data;
        if(!state.ui) state.ui={selectedProject:'all', kpiSelection:KPI_DEFS.map(k=>k.id)};
        if(!state.risks) state.risks=[];
        persist(true); renderAll();
        showToast('Données importées avec succès');
      }catch(err){ showToast('Fichier invalide'); }
    };
    reader.readAsText(file);
    e.target.value='';
  });
}

async function init(){
  await loadState();
  setupEvents();
  renderAll();
}
init();
</script>
